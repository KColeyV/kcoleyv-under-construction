<style>
  :root{
    --dark:#1a1a1a;
    --paper:#f5f5f2;
    --accent:#94aa0e;
    --accent-soft:rgba(148,170,14,0.16);
    --muted-dark:#9a9a92;
    --glass-dark-bg:rgba(255,255,255,0.06);
    --glass-dark-border:rgba(255,255,255,0.16);
    --sans:'DM Sans', sans-serif;
    --display:'Archivo Expanded', sans-serif;
    --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--sans); background:var(--dark); color:var(--paper);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:6vh 6vw; position:relative; overflow:hidden; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}

  .grain-svg{position:absolute; inset:0; width:100%; height:100%; opacity:0.5; mix-blend-mode:overlay; pointer-events:none;}

  .wrap{position:relative; z-index:2; max-width:560px; width:100%; text-align:center; display:flex; flex-direction:column; align-items:center;}

  .logo-photo{position:relative; width:110px; height:110px; margin-bottom:2.5rem;}
  .logo-photo::before{
    content:''; position:absolute; inset:-14px; border-radius:50%;
    background:radial-gradient(circle, var(--accent-soft), transparent 70%); filter:blur(16px); z-index:0;
  }
  .logo-photo img{
    position:relative; z-index:1; width:100%; height:100%; object-fit:cover; border-radius:50%;
    border:1px solid var(--glass-dark-border); display:block;
  }

  h1{
    font-family:var(--display); font-weight:700; letter-spacing:-0.01em;
    font-size:clamp(2.4rem, 5vw + 1rem, 4rem); line-height:1.05; margin-bottom:1.5rem;
  }
  h1 .accent-dot{color:var(--accent);}

  .lang-toggle{
    position:fixed; top:1.5rem; right:1.5rem; z-index:5;
    font-family:var(--mono); font-size:0.7rem; letter-spacing:0.05em; text-transform:uppercase;
    padding:0.5rem 0.95rem; border-radius:999px; border:1px solid var(--glass-dark-border);
    background:var(--glass-dark-bg); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    color:var(--paper); cursor:pointer; transition:border-color .25s ease, background .25s ease;
  }
  .lang-toggle:hover{border-color:var(--accent); background:var(--accent-soft);}

  .lead{font-size:1.05rem; color:var(--muted-dark); max-width:42ch; margin:0 auto 3rem;}

  .social-row{display:flex; gap:1rem; flex-wrap:wrap; justify-content:center;}
  .social-link{
    display:inline-flex; align-items:center; gap:0.6rem; font-family:var(--mono); font-size:0.75rem;
    letter-spacing:0.06em; text-transform:uppercase; padding:0.85rem 1.5rem; border-radius:999px;
    border:1px solid var(--glass-dark-border); background:var(--glass-dark-bg);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:border-color .25s ease, transform .25s ease, background .25s ease;
  }
  .social-link:hover{border-color:var(--accent); transform:translateY(-2px); background:var(--accent-soft);}
  .social-link svg{width:16px; height:16px; flex-shrink:0;}

  @media (prefers-reduced-motion:reduce){
    .grain-svg animate{display:none;}
  }
</style>
</head>

      lead: "I'm preparing a new version of this site, with more detailed information about my work. In the meantime, you can find me on:",
      metaDescription: 'KC — graphic design, illustration, content marketing and copywriting in Cartagena de Indias. Site under construction, coming soon.',
      toggleLabel: 'ES',
      toggleAria: 'Cambiar a español'
    }
  };

  function setLanguage(lang){
    var t = translations[lang];
    document.documentElement.lang = t.htmlLang;
    document.title = t.pageTitle;
    document.querySelector('[data-i18n="heading"]').textContent = t.heading;
    document.querySelector('[data-i18n="lead"]').textContent = t.lead;
    document.getElementById('metaDescription').setAttribute('content', t.metaDescription);
    document.getElementById('ogTitle').setAttribute('content', t.pageTitle);
    document.getElementById('ogDescription').setAttribute('content', t.metaDescription);
    document.getElementById('twitterTitle').setAttribute('content', t.pageTitle);
    document.getElementById('twitterDescription').setAttribute('content', t.metaDescription);
    var btn = document.getElementById('langToggle');
    btn.textContent = t.toggleLabel;
    btn.setAttribute('aria-label', t.toggleAria);
    btn.dataset.current = lang;
  }

  document.getElementById('langToggle').addEventListener('click', function(){
    setLanguage(this.dataset.current === 'es' ? 'en' : 'es');
  });
</script>

</body>
</html>
